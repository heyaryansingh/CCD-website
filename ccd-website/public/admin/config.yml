# CCD website — what the editing tool at /admin shows and saves.
#
# Developers: adding a section kind means updating THREE places — lib/types.ts,
# RenderSection() in components/PageView.tsx, and the `sections` types below.
# If it is missing here, editors simply cannot create one.
#
# Paths are relative to the REPOSITORY root, not to ccd-website/.

backend:
  name: github
  repo: heyaryansingh/CCD-website
  branch: main
  base_url: https://ccdgroup.vercel.app
  auth_endpoint: api/auth
  commit_messages:
    create: 'Add {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Delete {{collection}} "{{slug}}"'
    uploadMedia: 'Upload {{path}}'
    deleteMedia: 'Delete {{path}}'

# Where uploaded pictures are stored, and the address the website uses for them.
media_folder: ccd-website/public/media
public_folder: /media

# Saving publishes. There is no separate "publish" step to forget.
publish_mode: simple

collections:
  # ---------------------------------------------------------------- PAGES ----
  - name: pages
    label: Pages
    label_singular: Page
    description: >-
      Every page on the website. Open one to change its wording, or to add,
      remove and reorder the blocks it is built from.
    folder: ccd-website/content/pages
    extension: json
    format: json
    create: true
    slug: '{{fields.key}}'
    identifier_field: title
    summary: '{{title}}  —  /{{slug}}'
    sortable_fields: [title, slug]
    fields:
      - name: key
        label: File name
        widget: string
        hint: >-
          Lowercase, dashes instead of spaces. This becomes part of the web
          address. Do not change it on an existing page — old links would break.
        pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and dashes only']
      - name: slug
        label: Web address
        widget: string
        required: false
        hint: >-
          What comes after ccdgroup.org/ — usually the same as the file name.
          Leave blank only for the home page.
      - name: title
        label: Browser tab title
        widget: string
        hint: Shown in the browser tab and in Google results.
      - name: description
        label: Search description
        widget: text
        hint: One or two sentences describing the page, shown under the title in Google.
      - name: active
        label: Highlighted menu item
        widget: select
        hint: Which top menu item lights up when someone is on this page.
        options: [home, about, programs, involved, projects, news, contact, brew]
      - name: brand
        label: Brand styling
        widget: select
        required: false
        hint: >-
          Leave empty for the normal CCD look. "brew" switches this page to The
          4th Brew's colours and fonts.
        options: ['', brew]
      - name: eyebrow
        label: Small label above the headline
        widget: string
        required: false
        hint: Short, usually in capitals. For example ABOUT THE 4TH BREW.
      - name: heroTitle
        label: Headline
        widget: string
      - name: heroAccent
        label: Headline second line
        widget: string
        required: false
        hint: Appears under the headline in the handwritten accent style.
      - name: heroBody
        label: Opening paragraph
        widget: text
      - name: heroImage
        label: Top image
        widget: image
        required: false
        choose_url: true
        hint: Wide photos work best. Aim for under 500 KB so the page loads quickly.
      - name: heroAlt
        label: Image description
        widget: string
        required: false
        hint: >-
          Describes the picture for people using a screen reader. Say what is in
          it, not "photo of".
      - name: heroPosition
        label: Image crop position
        widget: string
        required: false
        hint: >-
          Only needed if the top image is cropped badly. Try "center 30%" to show
          more of the top.
      - name: heroCta
        label: Button
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: label, label: Button text, widget: string }
          - { name: href, label: Button link, widget: string, hint: 'A page on this site starts with / — for example /membership' }
      - name: sections
        label: Page blocks
        label_singular: Block
        widget: list
        hint: >-
          The page is built from these blocks, top to bottom. Drag to reorder,
          use the menu on a block to duplicate or delete it, and press Add to
          choose a new kind of block.
        types:
          - name: split
            label: Text beside an image
            summary: 'Text + image — {{title}}'
            fields:
              - { name: id, label: Link anchor, widget: string, required: false, hint: 'Optional. Lets you link straight to this block with #name' }
              - { name: eyebrow, label: Small label, widget: string, required: false }
              - { name: title, label: Heading, widget: string }
              - { name: body, label: Paragraph, widget: text }
              - name: bullets
                label: Bullet points
                widget: list
                required: false
                field: { name: item, label: Point, widget: string }
              - { name: image, label: Image, widget: image, required: false, choose_url: true }
              - { name: alt, label: Image description, widget: string, required: false }
              - { name: reverse, label: Put the image on the left, widget: boolean, required: false, default: false }
              - name: theme
                label: Colour
                widget: select
                required: false
                options: [light, green, dark, blue]
              - { name: ctaText, label: Button text, widget: string, required: false }
              - { name: ctaHref, label: Button link, widget: string, required: false }
          - name: cards
            label: Row of cards
            summary: 'Cards — {{title}}'
            fields:
              - { name: id, label: Link anchor, widget: string, required: false }
              - { name: eyebrow, label: Small label, widget: string, required: false }
              - { name: title, label: Heading, widget: string }
              - { name: body, label: Intro paragraph, widget: text, required: false }
              - name: theme
                label: Colour
                widget: select
                required: false
                options: [light, gray, dark]
              - name: cards
                label: Cards
                label_singular: Card
                widget: list
                summary: '{{title}}'
                fields:
                  - { name: title, label: Card heading, widget: string }
                  - { name: body, label: Card text, widget: text }
                  - { name: meta, label: Small label on the card, widget: string, required: false }
                  - { name: image, label: Card image, widget: image, required: false, choose_url: true }
                  - { name: alt, label: Image description, widget: string, required: false }
                  - { name: href, label: Card link, widget: string, required: false }
                  - name: bullets
                    label: Detail lines
                    widget: list
                    required: false
                    field: { name: item, label: Line, widget: string }
          - name: cta
            label: Call to action band
            summary: 'Call to action — {{title}}'
            fields:
              - { name: title, label: Heading, widget: string }
              - { name: body, label: Paragraph, widget: text }
              - { name: label, label: Button text, widget: string }
              - { name: href, label: Button link, widget: string }
              - name: theme
                label: Colour
                widget: select
                required: false
                options: [green, dark, gold]
          - name: band
            label: Full-width statement
            summary: 'Statement — {{title}}'
            fields:
              - { name: id, label: Link anchor, widget: string, required: false }
              - { name: eyebrow, label: Small label, widget: string, required: false }
              - { name: title, label: Heading, widget: string }
              - { name: body, label: Paragraph, widget: text, required: false }
              - { name: image, label: Background image, widget: image, required: false, choose_url: true }
              - { name: alt, label: Image description, widget: string, required: false }
              - name: theme
                label: Colour
                widget: select
                required: false
                options: [light, dark]
              - name: cta
                label: Button
                widget: object
                required: false
                collapsed: true
                fields:
                  - { name: label, label: Button text, widget: string }
                  - { name: href, label: Button link, widget: string }
          - name: values
            label: Three promises
            summary: 'Promises ({{items.length}})'
            fields:
              - { name: id, label: Link anchor, widget: string, required: false }
              - { name: eyebrow, label: Small label, widget: string, required: false }
              - { name: title, label: Heading, widget: string, required: false }
              - { name: body, label: Intro paragraph, widget: text, required: false }
              - name: items
                label: Promises
                widget: list
                summary: '{{title}}'
                fields:
                  - { name: title, label: Heading, widget: string }
                  - { name: body, label: Text, widget: text }
          - name: faq
            label: Questions and answers
            summary: 'FAQ — {{title}}'
            fields:
              - { name: id, label: Link anchor, widget: string, required: false }
              - { name: eyebrow, label: Small label, widget: string, required: false }
              - { name: title, label: Heading, widget: string }
              - { name: body, label: Intro paragraph, widget: text, required: false }
              - name: items
                label: Questions
                widget: list
                summary: '{{q}}'
                fields:
                  - { name: q, label: Question, widget: string }
                  - { name: a, label: Answer, widget: text }
          - name: steps
            label: Numbered steps
            summary: 'Steps — {{title}}'
            fields:
              - { name: id, label: Link anchor, widget: string, required: false }
              - { name: eyebrow, label: Small label, widget: string, required: false }
              - { name: title, label: Heading, widget: string }
              - { name: body, label: Intro paragraph, widget: text, required: false }
              - name: theme
                label: Colour
                widget: select
                required: false
                options: [light, green, dark]
              - name: steps
                label: Steps
                widget: list
                summary: '{{n}} {{title}}'
                fields:
                  - { name: n, label: Number, widget: string, hint: 'For example 01' }
                  - { name: title, label: Heading, widget: string }
                  - { name: body, label: Text, widget: text }
          - name: stats
            label: Big numbers
            summary: 'Numbers — {{title}}'
            fields:
              - { name: eyebrow, label: Small label, widget: string, required: false }
              - { name: title, label: Heading, widget: string }
              - { name: body, label: Intro paragraph, widget: text, required: false }
              - name: theme
                label: Colour
                widget: select
                required: false
                options: [green, dark, light]
              - name: stats
                label: Numbers
                widget: list
                summary: '{{value}} {{label}}'
                fields:
                  - { name: value, label: Number, widget: string, hint: 'For example 120 or $40,000' }
                  - { name: label, label: What it counts, widget: string }
          - name: gallery
            label: Photo gallery
            summary: 'Gallery — {{title}}'
            fields:
              - { name: title, label: Heading, widget: string }
              - name: theme
                label: Colour
                widget: select
                required: false
                options: [light, dark]
              - { name: credit, label: Photo credit, widget: string, required: false }
              - name: images
                label: Photos
                widget: list
                summary: '{{alt}}'
                fields:
                  - { name: src, label: Photo, widget: image, choose_url: true }
                  - { name: alt, label: Photo description, widget: string }
          - name: timeline
            label: History timeline
            summary: 'Timeline — {{title}}'
            fields:
              - { name: title, label: Heading, widget: string }
              - name: items
                label: Moments
                widget: list
                summary: '{{year}} {{title}}'
                fields:
                  - { name: year, label: Year, widget: string }
                  - { name: title, label: Heading, widget: string }
                  - { name: body, label: Text, widget: text }
          - name: beforeAfter
            label: Before and after slider
            summary: 'Before/after — {{title}}'
            fields:
              - { name: id, label: Link anchor, widget: string, required: false }
              - { name: eyebrow, label: Small label, widget: string, required: false }
              - { name: title, label: Heading, widget: string }
              - { name: body, label: Intro paragraph, widget: text, required: false }
              - name: pairs
                label: Pairs
                widget: list
                summary: '{{label}}'
                fields:
                  - { name: before, label: Before photo, widget: image, choose_url: true }
                  - { name: after, label: After photo, widget: image, choose_url: true }
                  - { name: label, label: Caption, widget: string }
          - name: directory
            label: Who to contact list
            summary: 'Contacts — {{title}}'
            fields:
              - { name: id, label: Link anchor, widget: string, required: false }
              - { name: title, label: Heading, widget: string }
              - { name: body, label: Intro paragraph, widget: text, required: false }
          - name: products
            label: 4th Brew coffee shop
            summary: 'Coffee — {{title}}'
            fields:
              - { name: id, label: Link anchor, widget: string, required: false }
              - { name: eyebrow, label: Small label, widget: string, required: false }
              - { name: title, label: Heading, widget: string }
              - { name: body, label: Intro paragraph, widget: text, required: false }
          - name: partnerWall
            label: Partner logos
            summary: 'Partners — {{title}}'
            fields:
              - { name: id, label: Link anchor, widget: string, required: false }
              - { name: title, label: Heading, widget: string }
              - { name: body, label: Intro paragraph, widget: text, required: false }
          - name: projectMap
            label: Map of projects
            summary: 'Map — {{title}}'
            fields:
              - { name: id, label: Link anchor, widget: string, required: false }
              - { name: title, label: Heading, widget: string }
              - { name: body, label: Intro paragraph, widget: text, required: false }
          - name: testimonials
            label: Quotes from neighbours
            summary: 'Quotes — {{title}}'
            fields:
              - { name: id, label: Link anchor, widget: string, required: false }
              - { name: title, label: Heading, widget: string }
              - { name: body, label: Intro paragraph, widget: text, required: false }
          # Blocks with no settings — the content comes from the lists in the
          # sidebar (Team, Events, Membership tiers, and so on).
          - name: heart
            label: 'H.E.A.R.T. framework'
            summary: 'H.E.A.R.T. framework'
            fields: [{ name: id, label: Link anchor, widget: string, required: false }]
          - name: aboutTeam
            label: 'Team preview (from the Team list)'
            summary: 'Team preview'
            fields: [{ name: id, label: Link anchor, widget: string, required: false }]
          - name: teamFull
            label: 'Full team (from the Team list)'
            summary: 'Full team'
            fields: [{ name: id, label: Link anchor, widget: string, required: false }]
          - name: membershipTiers
            label: 'Membership tiers (from the Membership tiers list)'
            summary: 'Membership tiers'
            fields: [{ name: id, label: Link anchor, widget: string, required: false }]
          - name: membershipFaq
            label: Membership questions
            summary: 'Membership questions'
            fields: [{ name: id, label: Link anchor, widget: string, required: false }]
          - name: estimateForm
            label: 'Clean & Green estimate form'
            summary: 'Estimate form'
            fields: [{ name: id, label: Link anchor, widget: string, required: false }]
          - name: donatePanel
            label: Donate and volunteer panel
            summary: 'Donate + volunteer'
            fields: [{ name: id, label: Link anchor, widget: string, required: false }]
          - name: contactPanel
            label: Contact form and map
            summary: 'Contact form'
            fields: [{ name: id, label: Link anchor, widget: string, required: false }]
          - name: newsEvents
            label: 'Latest news and events'
            summary: 'News + events'
            fields: [{ name: id, label: Link anchor, widget: string, required: false }]
          - name: eventsFull
            label: 'All events (from the Events list)'
            summary: 'All events'
            fields: [{ name: id, label: Link anchor, widget: string, required: false }]

  # ------------------------------------------------------------- PROJECTS ----
  - name: projects
    label: Project pages
    label_singular: Project page
    description: The detail pages for individual projects, such as Oasis @ 240.
    folder: ccd-website/content/projects
    extension: json
    format: json
    create: true
    slug: '{{fields.key}}'
    identifier_field: title
    summary: '{{title}}'
    fields:
      - { name: key, label: File name, widget: string, pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and dashes only'] }
      - { name: slug, label: Web address, widget: string, hint: 'Appears as /projects/…' }
      - { name: title, label: Browser tab title, widget: string }
      - { name: description, label: Search description, widget: text }
      - { name: active, label: Highlighted menu item, widget: hidden, default: projects }
      - { name: eyebrow, label: Small label above the headline, widget: string, required: false }
      - { name: heroTitle, label: Headline, widget: string }
      - { name: heroAccent, label: Headline second line, widget: string, required: false }
      - { name: heroBody, label: Opening paragraph, widget: text }
      - { name: heroImage, label: Top image, widget: image, required: false, choose_url: true }
      - { name: heroAlt, label: Image description, widget: string, required: false }
      - { name: heroPosition, label: Image crop position, widget: string, required: false }
      - name: sections
        label: Page blocks
        widget: list
        required: false
        types:
          - name: split
            label: Text beside an image
            summary: 'Text + image — {{title}}'
            fields:
              - { name: id, label: Link anchor, widget: string, required: false }
              - { name: eyebrow, label: Small label, widget: string, required: false }
              - { name: title, label: Heading, widget: string }
              - { name: body, label: Paragraph, widget: text }
              - name: bullets
                label: Bullet points
                widget: list
                required: false
                field: { name: item, label: Point, widget: string }
              - { name: image, label: Image, widget: image, required: false, choose_url: true }
              - { name: alt, label: Image description, widget: string, required: false }
              - { name: reverse, label: Put the image on the left, widget: boolean, required: false, default: false }
              - name: theme
                label: Colour
                widget: select
                required: false
                options: [light, green, dark, blue]
              - { name: ctaText, label: Button text, widget: string, required: false }
              - { name: ctaHref, label: Button link, widget: string, required: false }
          - name: gallery
            label: Photo gallery
            summary: 'Gallery — {{title}}'
            fields:
              - { name: title, label: Heading, widget: string }
              - { name: credit, label: Photo credit, widget: string, required: false }
              - name: theme
                label: Colour
                widget: select
                required: false
                options: [light, dark]
              - name: images
                label: Photos
                widget: list
                summary: '{{alt}}'
                fields:
                  - { name: src, label: Photo, widget: image, choose_url: true }
                  - { name: alt, label: Photo description, widget: string }
          - name: cta
            label: Call to action band
            summary: 'Call to action — {{title}}'
            fields:
              - { name: title, label: Heading, widget: string }
              - { name: body, label: Paragraph, widget: text }
              - { name: label, label: Button text, widget: string }
              - { name: href, label: Button link, widget: string }
              - name: theme
                label: Colour
                widget: select
                required: false
                options: [green, dark, gold]

  # --------------------------------------------------------------- LISTS -----
  - name: lists
    label: Lists
    description: >-
      Content that appears in several places — the team, news, events, partners
      and so on. Change it once here and it updates everywhere it is shown.
    files:
      - name: news
        label: News
        file: ccd-website/content/collections/news.json
        fields:
          - name: items
            label: News articles
            label_singular: Article
            widget: list
            summary: '{{title}}'
            fields:
              - { name: id, label: Short name, widget: string, hint: 'Lowercase, dashes instead of spaces. Used in the link to this article.' }
              - { name: title, label: Headline, widget: string }
              - { name: meta, label: Date line, widget: string, hint: 'For example: Jun 2026 · Baltimore Sun' }
              - { name: thumb, label: Photo, widget: image, choose_url: true }
              - { name: excerpt, label: Short summary, widget: text, hint: 'One or two sentences shown in the list.' }
              - { name: body, label: Full article, widget: text }
              - name: photos
                label: More photos
                widget: list
                required: false
                field: { name: src, label: Photo, widget: image, choose_url: true }
              - name: instructions
                label: Steps or details
                widget: list
                required: false
                field: { name: item, label: Line, widget: string }
              - { name: contactEmail, label: Contact email, widget: string, required: false }
              - { name: contactLabel, label: Contact button text, widget: string, required: false }

      - name: events
        label: Events
        file: ccd-website/content/collections/events.json
        fields:
          - name: items
            label: Events
            label_singular: Event
            widget: list
            summary: '{{date}} — {{title}}'
            fields:
              - { name: id, label: Short name, widget: string, hint: 'Lowercase, dashes instead of spaces.' }
              - { name: title, label: Event name, widget: string }
              - { name: date, label: Month, widget: string, hint: 'For example JUN' }
              - { name: day, label: Day, widget: string, hint: 'For example 21' }
              - { name: time, label: Time, widget: string }
              - { name: location, label: Place, widget: string }
              - { name: cost, label: Cost, widget: string, hint: 'For example Free' }
              - { name: tag, label: Category label, widget: string }
              - name: tagColor
                label: Category colour
                widget: select
                options: [green, gold, blue, slate]
              - { name: thumb, label: Photo, widget: image, choose_url: true }
              - { name: blurb, label: Short summary, widget: text }
              - { name: body, label: Full description, widget: text }
              - name: instructions
                label: What to bring or know
                widget: list
                required: false
                field: { name: item, label: Line, widget: string }
              - name: photos
                label: More photos
                widget: list
                required: false
                field: { name: src, label: Photo, widget: image, choose_url: true }
              - { name: contactEmail, label: Contact email, widget: string, required: false }
              - { name: contactLabel, label: Contact button text, widget: string, required: false }

      - name: team
        label: Team
        file: ccd-website/content/collections/team.json
        fields:
          - name: items
            label: Team members
            label_singular: Person
            widget: list
            summary: '{{name}} — {{role}}'
            fields:
              - { name: name, label: Name, widget: string }
              - { name: role, label: Role, widget: string }
              - { name: order, label: Position in the list, widget: number, required: false, value_type: int }
              - { name: tagline, label: One-line description, widget: string, required: false }
              - { name: bio, label: Biography, widget: text, required: false }
              - { name: quote, label: Quote, widget: text, required: false }
              - { name: email, label: Email, widget: string, required: false }
              - { name: photo, label: Photo, widget: image, required: false, choose_url: true, hint: 'Leave empty to show their initials instead.' }

      - name: interns
        label: Interns
        file: ccd-website/content/collections/interns.json
        fields:
          - name: items
            label: Interns
            label_singular: Intern
            widget: list
            summary: '{{name}} — {{role}}'
            fields:
              - { name: name, label: Name, widget: string, required: false, hint: 'Leave empty for an unfilled placeholder spot.' }
              - { name: role, label: Role, widget: string }
              - { name: order, label: Position in the list, widget: number, required: false, value_type: int }
              - { name: bio, label: Biography, widget: text, required: false }
              - { name: email, label: Email, widget: string, required: false }
              - { name: photo, label: Photo, widget: image, required: false, choose_url: true }

      - name: partners
        label: Partners and funders
        file: ccd-website/content/collections/partners.json
        fields:
          - name: items
            label: Partners
            label_singular: Partner
            widget: list
            summary: '{{name}}'
            fields:
              - { name: name, label: Name, widget: string }
              - { name: description, label: Description, widget: text }
              - { name: url, label: Website, widget: string, required: false, hint: 'Full address starting with https:// — or a page on this site starting with /' }
              - name: category
                label: Type
                widget: select
                options: [program, community, funder, member]
              - { name: logo, label: Logo, widget: image, required: false, choose_url: true }

      - name: supporters
        label: Supporter logos
        file: ccd-website/content/collections/supporters.json
        fields:
          - name: items
            label: Logos
            label_singular: Logo
            widget: list
            summary: '{{alt}}'
            fields:
              - { name: src, label: Logo, widget: image, choose_url: true }
              - { name: alt, label: Organisation name, widget: string }

      - name: directory
        label: Who to contact
        file: ccd-website/content/collections/directory.json
        fields:
          - name: items
            label: Contacts
            label_singular: Contact
            widget: list
            summary: '{{area}} — {{person}}'
            fields:
              - { name: area, label: Area, widget: string }
              - { name: person, label: Person, widget: string }
              - { name: title, label: Their role, widget: string }
              - { name: email, label: Email, widget: string }

      - name: membership-tiers
        label: Membership tiers
        file: ccd-website/content/collections/membership-tiers.json
        fields:
          - name: items
            label: Tiers
            label_singular: Tier
            widget: list
            summary: '{{name}} — {{price}}'
            fields:
              - { name: name, label: Tier name, widget: string }
              - { name: price, label: Price, widget: string }
              - { name: setup, label: Joining fee, widget: string }
              - { name: eligibility, label: Who can join, widget: string }
              - { name: vote, label: Includes a vote, widget: boolean }
              - { name: featured, label: Highlight this tier, widget: boolean, required: false }
              - name: benefits
                label: What is included
                widget: list
                field: { name: item, label: Benefit, widget: string }

      - name: cleangreen-services
        label: 'Clean & Green services'
        file: ccd-website/content/collections/cleangreen-services.json
        fields:
          - name: items
            label: Services offered
            label_singular: Service
            widget: list
            field: { name: item, label: Service, widget: string }

      - name: home-hero
        label: Home page slideshow
        file: ccd-website/content/collections/home-hero.json
        fields:
          - name: items
            label: Slides
            label_singular: Slide
            widget: list
            summary: '{{kicker}}'
            fields:
              - { name: src, label: Photo, widget: image, choose_url: true }
              - { name: alt, label: Photo description, widget: string }
              - { name: kicker, label: Caption, widget: string }

      - name: before-after
        label: Before and after photos
        file: ccd-website/content/collections/before-after.json
        fields:
          - name: items
            label: Pairs
            label_singular: Pair
            widget: list
            summary: '{{label}}'
            fields:
              - { name: before, label: Before, widget: image, choose_url: true }
              - { name: after, label: After, widget: image, choose_url: true }
              - { name: label, label: Caption, widget: string }

      - name: project-pins
        label: Map pins
        file: ccd-website/content/collections/project-pins.json
        fields:
          - name: items
            label: Pins on the map
            label_singular: Pin
            widget: list
            summary: '{{name}}'
            fields:
              - { name: name, label: Place, widget: string }
              - { name: status, label: Status, widget: string }
              - { name: href, label: Link, widget: string }
