              - { name: y, label: Position down (%), widget: number, value_type: float, hint: '0 is the top, 100 the bottom.' }

      - name: testimonials
        label: Quotes from neighbours
        file: ccd-website/content/collections/testimonials.json
        fields:
          - name: items
            label: Quotes
            label_singular: Quote
            widget: list
            summary: '{{name}}'
            fields:
              - { name: quote, label: Quote, widget: text }
              - { name: name, label: Who said it, widget: string }
              - { name: role, label: Their role, widget: string, required: false }
              - { name: photo, label: Photo, widget: image, required: false, choose_url: true }

  # ---------------------------------------------------------- 4TH BREW -------
  - name: brew
    label: 4th Brew coffee
    description: >-
      The coffee brand's own content. Prices and stock come from Shopify
      automatically — the details here are only used if Shopify cannot be reached.
    files:
      - name: brew-products
        label: Coffees
        file: ccd-website/content/collections/brew-products.json
        fields:
          - name: items
            label: Coffees
            label_singular: Coffee
            widget: list
            summary: '{{title}} — {{roast}}'
            fields:
              - { name: handle, label: Shopify handle, widget: string, hint: 'Must match the product handle in Shopify exactly, or the live price will not be found.' }
              - { name: title, label: Name, widget: string }
              - { name: roast, label: Roast, widget: string, hint: 'For example Medium roast' }
              - { name: notes, label: Tasting notes, widget: text }
              - { name: image, label: Photo, widget: image, choose_url: true, hint: 'Only shown if Shopify is unreachable — normally the Shopify photo is used.' }
              - { name: alt, label: Photo description, widget: string }
              - name: variants
                label: Sizes and grinds
                widget: list
                summary: '{{title}} — ${{price}}'
                hint: 'Backup only. Editing this does NOT change what customers are charged — Shopify does that.'
                fields:
                  - { name: id, label: Shopify variant ID, widget: number, value_type: int }
                  - { name: title, label: Size / grind, widget: string, hint: 'Must match Shopify exactly, e.g. "12oz / Whole bean"' }
                  - { name: price, label: Price, widget: string }
                  - { name: available, label: In stock, widget: boolean }

      - name: brewing-methods
        label: Brewing guide
        file: ccd-website/content/collections/brewing-methods.json
        fields:
          - name: items
            label: Methods
            label_singular: Method
            widget: list
            summary: '{{title}}'
            fields:
              - { name: title, label: Method, widget: string }
              - { name: meta, label: Descriptors, widget: string, hint: 'For example BALANCED · RELIABLE · EVERYDAY' }
              - { name: body, label: Description, widget: text }
              - { name: image, label: Icon, widget: image, choose_url: true }
              - { name: alt, label: Icon description, widget: string }
              - name: bullets
                label: How to brew it
                widget: list
                field: { name: item, label: Step, widget: string }

  # ------------------------------------------------------------ SETTINGS -----
  - name: settings
    label: Settings
    description: Contact details, social links, and the buttons that lead to payments.
    files:
      - name: contact
        label: Contact and organisation
        file: ccd-website/content/settings.json
        fields:
          - name: org
            label: Organisation
            widget: object
            fields:
              - { name: name, label: Name, widget: string }
              - { name: shortName, label: Short name, widget: string }
              - { name: legalName, label: Legal name, widget: string, hint: 'Used in the copyright line at the bottom of every page.' }
              - { name: tagline, label: Tagline, widget: text }
              - { name: founded, label: Year founded, widget: number, value_type: int }
          - name: contact
            label: Contact details
            widget: object
            hint: Changing these updates every page that shows them.
            fields:
              - { name: email, label: General email, widget: string }
              - { name: cleanGreenEmail, label: 'Clean & Green email', widget: string }
              - { name: facilitiesEmail, label: Facilities email, widget: string }
              - { name: phone, label: Phone number, widget: string, hint: 'As it should appear, e.g. (410) 205-2488' }
              - { name: phoneHref, label: Phone dial link, widget: string, hint: 'Digits only with country code, e.g. tel:+14102052488' }
              - { name: addressLine1, label: Street address, widget: string }
              - { name: addressLine2, label: 'City, state and ZIP', widget: string }
              - { name: mapQuery, label: Address for maps, widget: string }
          - name: social
            label: Social media
            widget: object
            hint: Leave one empty to hide that icon completely.
            fields:
              - { name: facebook, label: Facebook, widget: string, required: false }
              - { name: instagram, label: Instagram, widget: string, required: false }
              - { name: linkedin, label: LinkedIn, widget: string, required: false }
              - { name: youtube, label: YouTube, widget: string, required: false }
          - name: links
            label: Buttons and payment links
            widget: object
            hint: >-
              These power the Donate, Brick Campaign and booking buttons. If one
              is left empty its button quietly turns into an email link instead
              of breaking.
            fields:
              - { name: paypalDonate, label: Donate button link, widget: string, required: false, hint: 'The PayPal donation page. Test it after changing — this takes real money.' }
              - name: brewShop
                label: 4th Brew shop address
                widget: string
                required: false
                hint: >-
                  ⚠️ MUST be the store's PRIMARY domain in Shopify. Shopify sends
                  every checkout to whatever that is, so if this is wrong,
                  customers cannot buy coffee. Ask a developer before changing it.
              - { name: brickCampaign, label: Brick campaign link, widget: string, required: false }
              - { name: facilitiesBooking, label: Room booking form, widget: string, required: false }
              - { name: cleanGreenEstimate, label: 'Clean & Green estimate form', widget: string, required: false }
              - { name: vendorRegistration, label: Market vendor sign-up, widget: string, required: false }
              - { name: membershipSignup, label: Membership sign-up, widget: string, required: false, hint: 'Empty until a payment platform is chosen.' }
              - { name: privacyPolicy, label: Privacy policy link, widget: string, required: false }
              - { name: instagramFeedEmbed, label: Instagram feed embed, widget: string, required: false }
          - name: analytics
            label: Analytics
            widget: object
            fields:
              - { name: ga4, label: Google Analytics ID, widget: string, required: false, hint: 'Looks like G-XXXXXXX. Leave empty for no tracking.' }

      - name: navigation
        label: Menus
        file: ccd-website/content/navigation.json
        fields:
          - name: groups
            label: Main menu dropdowns
            widget: list
            summary: '{{label}}'
            fields:
              - { name: key, label: Internal name, widget: string }
              - { name: label, label: Menu text, widget: string }
              - { name: href, label: Link, widget: string }
              - name: active
                label: Highlight group
                widget: select
                options: [home, about, programs, involved, projects, news, contact, brew]
              - name: items
                label: Dropdown links
                widget: list
                summary: '{{label}}'
                fields:
                  - { name: label, label: Text, widget: string }
                  - { name: href, label: Link, widget: string }
          - name: simpleLinks
            label: Menu links without a dropdown
            widget: list
            summary: '{{label}}'
            fields:
              - { name: label, label: Text, widget: string }
              - { name: href, label: Link, widget: string }
              - name: active
                label: Highlight group
                widget: select
                options: [home, about, programs, involved, projects, news, contact, brew]
          - name: utilityLinks
            label: Top bar links
            widget: list
            summary: '{{label}}'
            fields:
              - { name: label, label: Text, widget: string }
              - { name: href, label: Link, widget: string }
          - name: donateCta
            label: Donate button
            widget: object
            fields:
              - { name: label, label: Text, widget: string }
              - { name: href, label: Link, widget: string }
          - name: footerColumns
            label: Footer link columns
            widget: list
            summary: '{{title}}'
            fields:
              - { name: title, label: Column heading, widget: string }
              - name: links
                label: Links
                widget: list
                summary: '{{label}}'
                fields:
                  - { name: label, label: Text, widget: string }
                  - { name: href, label: Link, widget: string }
          - name: aliases
            label: Old web addresses
            widget: keyvalue
            hint: >-
              Sends an old address to its new page, so links printed on flyers
              keep working. Left side is the old address, right side is the page
              name it should go to.
