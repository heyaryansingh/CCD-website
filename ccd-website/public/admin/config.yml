# CCD website — the editing tool at /admin.
#
# This file holds only the settings that apply to the whole editor. Every
# collection lives in its own file under collections/, and index.html lists them
# with <link rel="cms-config-url"> tags. Sveltia merges the files in the order
# those tags appear, which is also the order of the sidebar.
#
# Adding a collection is therefore: write collections/<name>.yml, add one link
# tag. Nothing in this file changes, and the change cannot break any other
# collection — which is the point of splitting them up.
#
# Paths inside every file are relative to the REPOSITORY root, not to
# ccd-website/. Read collections/README.md before editing any of them.

backend:
  name: github
  repo: heyaryansingh/CCD-website
  branch: main
  # Where the sign-in popup goes. It must be the SAME origin editors open /admin
  # on, and it must match the GitHub OAuth App's callback URL — /api/auth sends
  # no redirect_uri, so GitHub always returns to the one address registered on
  # the app. One OAuth App therefore serves exactly one hostname.
  #
  # Change this and the GitHub callback together, or sign-in breaks in a way that
  # looks like "the editor is down". docs/CLOUDFLARE-CUTOVER.md step 4.
  base_url: https://ccdgroup.org
  auth_endpoint: api/auth
  commit_messages:
    create: 'Add {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Delete {{collection}} "{{slug}}"'
    uploadMedia: 'Upload {{path}}'
    deleteMedia: 'Delete {{path}}'

# Where uploaded pictures are stored, and the address the website uses for them.
media_folder: ccd-website/public/media
public_folder: /media

# Saving publishes. There is no separate "publish" step to forget.
publish_mode: simple
